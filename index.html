<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV modulare — Elena Mauri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside id="editor" class="editor" aria-label="Moduli del CV"></aside>
    <main class="preview" id="preview">
      <p class="preview-note">Clicca un testo sul foglio per modificarlo. I moduli si accendono dal pannello. Cmd-click apre i link.</p>
      <article id="sheet" class="sheet" aria-label="Anteprima del CV"></article>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
